<main>
  <header class="gallery-page-header container" data-reveal>
    <h1>活动摄影</h1>
    <p class="lede">企业活动 · 年会 · 发布会 · 路演 · 展会 — 专业纪实，快速交付。</p>
  </header>

  <section class="container">
    <div class="gallery-toolbar">
      <div id="event-filter"></div>
      <span class="gallery-count" id="event-count" aria-live="polite"></span>
    </div>
    <div id="event-grid" class="gallery-mount"></div>
  </section>
</main>

<link rel="stylesheet" href="assets/css/components.css?v=2">
<link rel="stylesheet" href="assets/css/lightbox.css?v=2">
<link rel="stylesheet" href="assets/css/gallery.css?v=2">
<script type="module">
  import { mountGallery } from './assets/js/gallery.js?v=2';
  const filterEl = document.getElementById('event-filter');
  const gridEl = document.getElementById('event-grid');
  const countEl = document.getElementById('event-count');
  mountGallery({ mountEl: gridEl, filterEl, dataUrl: 'assets/data/event.json' });
  filterEl.addEventListener('click', () => {
    setTimeout(() => {
      const n = gridEl.querySelectorAll('.gallery-item').length;
      countEl.textContent = `${n} 组作品`;
    }, 0);
  });
  setTimeout(() => {
    const n = gridEl.querySelectorAll('.gallery-item').length;
    countEl.textContent = `${n} 组作品`;
  }, 500);
</script>
